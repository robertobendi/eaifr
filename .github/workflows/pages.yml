name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, mbstring, curl, json
          coverage: none
          tools: none

      # vendor/ is committed (per the project's "drop-in deploy" philosophy),
      # so we only need composer install if it's somehow missing.
      - name: Verify vendor present
        run: |
          if [ ! -d vendor ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          fi

      - name: Bootstrap DB + seed
        run: php bin/install-ci.php

      - name: Sync latest EAIFR X posts
        run: php bin/sync-x-news.php

      - name: Static export
        env:
          # The site lives at https://<owner>.github.io/<repo>/. GitHub
          # exposes that as github.repository (owner/repo) and the
          # repository name we derive from it.
          EAIFR_STATIC_BASE_PATH: /${{ github.event.repository.name }}
          EAIFR_STATIC_BASE_URL: https://${{ github.repository_owner }}.github.io
        run: php bin/export.php

      - name: Verify migrated site content
        run: php tests/site-content.php

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
